<div class="flex flex-col items-center justify-center px-6 py-14 text-center">
  <span class="mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-slate-100 text-slate-400 dark:bg-slate-800 dark:text-slate-500">
    <i data-lucide="{{ icon|default:'inbox' }}" class="h-6 w-6"></i>
  </span>
  <p class="text-sm font-semibold text-slate-700 dark:text-slate-200">{{ title|default:"Ma'lumot topilmadi" }}</p>
  {% if text %}<p class="mt-1 max-w-sm text-xs text-slate-400">{{ text }}</p>{% endif %}
  {% if link %}
    <a href="{{ link }}" class="mt-4 inline-flex items-center gap-1.5 rounded-xl bg-indigo-600 px-3.5 py-2 text-xs font-semibold text-white shadow-soft transition hover:bg-indigo-700">
      <i data-lucide="plus" class="h-3.5 w-3.5"></i> {{ link_label|default:"Qo'shish" }}
    </a>
  {% endif %}
</div>
