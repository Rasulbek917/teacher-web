{% load ui %}{% if person.avatar %}<img src="{% url 'core:file' 'avatar' person.id %}" alt="{{ person.full_name }}" class="{{ size|default:'h-10 w-10' }} rounded-full object-cover ring-2 ring-white dark:ring-slate-900">{% else %}<span class="{{ size|default:'h-10 w-10' }} flex items-center justify-center rounded-full bg-indigo-100 text-xs font-bold uppercase text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300">{{ person|initials }}</span>{% endif %}
