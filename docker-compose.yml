services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-et_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-et_password}
      POSTGRES_DB: ${POSTGRES_DB:-english_teachers}
      TZ: Asia/Tashkent
    ports:
      # Faqat lokal mashinadan ochiladi (tashqi tarmoqqa chiqmaydi).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-et_user} -d ${POSTGRES_DB:-english_teachers}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      TZ: Asia/Tashkent
      DATABASE_URL: ${DATABASE_URL:-postgresql://et_user:et_password@postgres:5432/english_teachers?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_secret_string_min_32_chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SUPERADMIN_LOGIN: ${SUPERADMIN_LOGIN:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-superadmin123}
      SUPERADMIN_FIRSTNAME: ${SUPERADMIN_FIRSTNAME:-Super}
      SUPERADMIN_LASTNAME: ${SUPERADMIN_LASTNAME:-Admin}
      SUPERADMIN_PHONE: ${SUPERADMIN_PHONE:-+998 90 000 00 00}
      UPLOAD_DIR: /app/uploads
      MAX_VIDEO_SIZE_MB: ${MAX_VIDEO_SIZE_MB:-200}
      MAX_ATTACHMENT_SIZE_MB: ${MAX_ATTACHMENT_SIZE_MB:-10}
      MAX_AVATAR_SIZE_MB: ${MAX_AVATAR_SIZE_MB:-5}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LESSON_REMINDER_MINUTES: ${LESSON_REMINDER_MINUTES:-30}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_BLOCK_MINUTES: ${LOGIN_BLOCK_MINUTES:-5}
    ports:
      # Faqat lokal mashinadan ochiladi (tashqi tarmoqqa chiqmaydi).
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  uploads:
