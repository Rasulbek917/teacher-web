{% load ui %}{% with ring=tone|tone_classes %}
<div class="card p-4 sm:p-5">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="truncate text-[11px] font-semibold uppercase tracking-wide text-slate-400">{{ label }}</p>
      <p class="mt-1.5 truncate text-xl font-bold tracking-tight text-slate-900 sm:text-2xl dark:text-white">{{ value }}</p>
      {% if hint %}<p class="mt-0.5 truncate text-[11px] text-slate-400">{{ hint }}</p>{% endif %}
    </div>
    <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl {{ ring }}"><i data-lucide="{{ icon|default:'activity' }}" class="h-[18px] w-[18px]"></i></span>
  </div>
</div>
{% endwith %}
